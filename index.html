<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlopTube</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f9f9;--card:#fff;--text:#030303;--sub:#606060;--line:#e5e5e5;--red:#ff0000;--blue:#065fd4;--hover:#f2f2f2}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
header{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:10;border-bottom:1px solid var(--line)}
.burger{width:40px;height:40px;border:0;background:none;border-radius:50%;font-size:20px}
.burger:hover{background:var(--hover)}
.logo{display:flex;align-items:center;gap:2px;font-size:20px;font-weight:500;letter-spacing:-1px}
.logo .play i{width:0;height:0;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.logo .play{background:var(--red);color:#fff;border-radius:6px;width:30px;height:21px;display:grid;place-items:center;font-size:11px;margin-right:3px}
.search{flex:1;display:flex;max-width:640px;margin:0 auto}
.search input{flex:1;height:32px;border:1px solid #ccc;border-right:0;padding:0 8px;font-size:16px;box-shadow:inset 0 1px 2px #eee;min-width:0}
.search button{width:64px;border:1px solid #d3d3d3;background:#f8f8f8;font-size:15px}
.hright{display:flex;gap:8px;align-items:center}
.btn-blue{border:1px solid var(--blue);color:var(--blue);background:#fff;padding:8px 12px;font-weight:500;text-transform:uppercase;font-size:14px;border-radius:2px}
.avatar{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:500;flex-shrink:0;text-transform:uppercase}
.avatar.big{width:80px;height:80px;font-size:36px}
.icon-btn{border:0;background:none;font-size:20px;width:40px;height:40px;border-radius:50%}
.icon-btn:hover{background:var(--hover)}
nav{position:fixed;top:56px;left:0;bottom:0;width:240px;background:#fff;padding:12px 0;overflow:auto}
nav a{display:flex;gap:24px;padding:0 24px;height:40px;align-items:center}
nav a:hover{background:var(--hover)}nav a.on{background:#e5e5e5;font-weight:500}
nav hr{border:0;border-top:1px solid var(--line);margin:12px 0}
nav .h{padding:8px 24px;color:var(--sub);text-transform:uppercase;font-weight:500;font-size:14px}
nav .foot a{display:inline!important;padding:0!important;height:auto!important}
.langs{display:flex;flex-direction:column;gap:8px;margin-top:8px}.langs label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);cursor:pointer}.langs input{width:auto!important;margin:0}.langs label.on{border-color:var(--blue);background:#e8f0fe}
.foot{padding:16px 24px;color:var(--sub);font-size:12px}
main{margin:56px 0 0 240px;padding:24px}
body.mini nav{display:none}body.mini main{margin-left:0}
.section-title{font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 4px}
.vcard{padding-right:4px;cursor:pointer}
.thumb{position:relative;aspect-ratio:16/9;background:#222;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:2px 4px;border-radius:2px}
.vmeta{display:flex;gap:12px;margin-top:12px}
.vtitle{font-weight:500;font-size:14px;line-height:1.4;max-height:2.8em;overflow:hidden;margin:0 0 6px}
.small{color:var(--sub);font-size:13px;line-height:1.5}
.small a:hover{color:var(--text)}
.watch{display:flex;gap:24px;max-width:1700px}
.watch .primary{flex:1;min-width:0}
.watch .secondary{width:402px;flex-shrink:0}
.player{background:#000;aspect-ratio:16/9;width:100%}
.player video{width:100%;height:100%}
.wtitle{font-size:18px;font-weight:400;margin:20px 0 8px}
.wbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap;gap:8px}
.likes{display:flex;gap:16px;align-items:center}
.likes button{border:0;background:none;color:var(--sub);font-size:13px;font-weight:500;text-transform:uppercase;display:flex;gap:6px;align-items:center;padding:6px}
.likes button.on{color:var(--blue)}
.ratio{height:2px;background:#ccc;margin-top:2px}.ratio div{height:100%;background:var(--sub)}
.owner{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.owner .avatar{width:48px;height:48px;font-size:20px}
.sub-btn{background:#cc0000;color:#fff;border:0;padding:10px 16px;font-weight:500;text-transform:uppercase;border-radius:2px;font-size:14px;margin-left:auto}
.sub-btn.on{background:#ececec;color:var(--sub)}
.desc{white-space:pre-wrap;margin-top:12px;line-height:1.5}
.comments h3{font-size:16px;font-weight:400;margin:24px 0}
.cform{display:flex;gap:16px;margin-bottom:32px}
.cform textarea{flex:1;border:0;border-bottom:1px solid #ccc;resize:none;font:inherit;padding:4px 0;outline:none;background:transparent}
.cform textarea:focus{border-bottom:2px solid #000}
.comment{display:flex;gap:16px;margin-bottom:16px}
.comment .avatar{width:40px;height:40px}
.comment b{font-size:13px;font-weight:500;margin-right:4px}
.comment p{margin:4px 0;white-space:pre-wrap;line-height:1.4}
.side-item{display:flex;gap:8px;margin-bottom:8px;cursor:pointer}
.side-item .thumb{width:168px;flex-shrink:0}
.side-item .vtitle{font-size:14px;margin-bottom:4px}
.upnext{display:flex;justify-content:space-between;margin-bottom:12px;font-size:16px}
.banner{height:160px;background:linear-gradient(120deg,#ff0000,#282828)}
.chead{background:#fff;padding:16px 10%;display:flex;gap:24px;align-items:center;margin:-24px -24px 24px}
.chead .info{flex:1}.chead h1{font-size:24px;font-weight:400;margin:0 0 4px}
.form{background:#fff;max-width:640px;margin:0 auto;padding:24px;border:1px solid var(--line)}
.form h2{margin-top:0;font-weight:400}
.form label{display:block;margin:16px 0 6px;color:var(--sub);font-size:13px}
.form input,.form textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:2px;font:inherit}
.form .primary{background:var(--blue);color:#fff;border:0;padding:10px 16px;font-weight:500;text-transform:uppercase;border-radius:2px;margin-top:20px}
.err{color:#c00;margin-top:12px}
.empty{text-align:center;color:var(--sub);padding:60px}
.progress{height:4px;background:#eee;margin-top:16px}.progress div{height:100%;background:var(--red);width:0}
.menu{position:absolute;right:16px;top:52px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:220px;padding:8px 0}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:10px 16px;border:0;background:none;font-size:14px}
.menu a:hover,.menu button:hover{background:var(--hover)}
.del{border:0;background:none;color:#c00;font-size:12px;margin-top:4px;padding:0}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
nav .ch{gap:16px}nav .ch .avatar{width:24px;height:24px;font-size:12px}
.banner{background-size:cover;background-position:center;aspect-ratio:6.2/1;height:auto;max-height:260px;min-height:100px}
.chwrap{background:#fff;margin:0 -24px 24px;padding:0 10%}
.chwrap .chead{margin:0;padding:16px 0;background:none}
.tabs{display:flex;gap:0}
.tabs a{padding:0 32px;height:48px;display:flex;align-items:center;text-transform:uppercase;font-weight:500;color:var(--sub);border-bottom:3px solid transparent;font-size:14px}
.tabs a.on{color:var(--text);border-color:var(--sub)}
.featured{display:flex;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.featured .player{width:424px;flex-shrink:0}
.about{display:flex;gap:48px}.about>div:first-child{flex:1}.about .stats{width:300px}
.about .stats div{border-bottom:1px solid var(--line);padding:12px 0}
select{padding:6px;font:inherit}
/* ===== SlopTube Studio ===== */
body.studio nav{display:none}body.studio main{margin-left:0;padding:0}body.studio #studiobtn{display:none}
body.studio .logo .play i{width:0;height:0;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.logo .play{background:#cc0000}
.st{display:flex;min-height:calc(100vh - 56px)}
.st-side{width:255px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding-bottom:16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.st-me{display:flex;flex-direction:column;align-items:center;padding:24px 16px;text-align:center;gap:4px}
.st-me .avatar{width:112px;height:112px;font-size:48px;margin-bottom:12px}
.st-side>a:not(.st-me){display:flex;gap:24px;align-items:center;height:48px;padding:0 24px;color:#606060;font-size:15px}
.st-side>a:not(.st-me):hover{background:var(--hover)}
.st-side>a.on{color:#cc0000;background:#f9f9f9;border-left:3px solid #cc0000;padding-left:21px}
.st-side>a.on span{color:var(--text);font-weight:500}
.st-main{flex:1;padding:24px 32px;min-width:0;background:#f9f9f9}
.st-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.st-head h1{font-size:24px;font-weight:500;margin:0}
.st-head>div{display:flex;gap:12px;align-items:center}
.st-create{border:1px solid #ccc;background:#fff;padding:8px 14px;font-weight:500;color:#cc0000;border-radius:2px}
.st-primary{background:#065fd4;color:#fff;border:0;padding:10px 16px;font-weight:500;border-radius:2px;cursor:pointer;font-size:14px}
.st-primary:disabled{opacity:.5}
.st-link{background:none;border:0;color:#065fd4;font-weight:500;padding:8px 0;cursor:pointer;font-size:14px}
.st-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;align-items:start}
.st-card{background:#fff;border:1px solid var(--line);padding:24px;border-radius:2px}
.st-card h3{font-size:16px;font-weight:500;margin:0 0 16px}
.st-card hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.st-big{font-size:36px;margin:4px 0}
.st-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--sub)}.st-row b{color:var(--text);font-weight:500}
.st-tabs{border-bottom:1px solid var(--line);margin:-8px 0 0;display:flex}
.st-tabs span{padding:12px 24px;font-weight:500;color:var(--sub)}.st-tabs .on{color:#cc0000;border-bottom:3px solid #cc0000}
.st-table{width:100%;border-collapse:collapse;background:#fff}
.st-table th{text-align:left;font-weight:500;color:var(--sub);font-size:12px;padding:12px;border-bottom:1px solid var(--line)}
.st-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.st-table tr:hover{background:#f9f9f9}
.st-vid{display:flex;gap:16px;min-width:340px}.st-vid .thumb{width:120px;flex-shrink:0}
.st-desc{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-acts{display:flex;gap:4px;margin-top:6px;visibility:hidden}.st-table tr:hover .st-acts{visibility:visible}
.st-acts a,.st-acts button{border:0;background:none;padding:4px 8px;border-radius:2px;font-size:12px;font-weight:500;color:var(--sub);cursor:pointer}
.st-acts a:hover,.st-acts button:hover{background:#e5e5e5}
.st-edit{display:flex;gap:24px;align-items:flex-start}
.st-edit label{display:block;margin:16px 0 6px;font-size:13px;color:var(--sub)}
.st-edit input[name=title],.st-edit textarea,#cu textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font:inherit}
.st-prev{width:360px;flex-shrink:0;padding:0;overflow:hidden}.st-prev>*:not(.player){margin-left:16px;margin-right:16px}.st-prev>:last-child{margin-bottom:16px}
.st-thumbs{display:flex;gap:12px}.st-thumbs .thumb{width:160px}
.st-upthumb{width:160px;aspect-ratio:16/9;border:1px dashed #909090;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--sub);cursor:pointer;margin:0!important}
#cu h3{margin-top:24px}
.st-brand{display:flex;gap:32px;align-items:center}
.st-bannerprev{width:260px;height:146px;background-size:cover;background-position:center;flex-shrink:0}
.st-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;padding:16px}
.st-dialog{background:#fff;width:100%;max-width:880px;max-height:90vh;overflow:auto;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.st-dialog label{display:block;margin:12px 0 6px;font-size:13px;color:var(--sub)}
.st-dialog input[name=title],.st-dialog textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font:inherit}
.st-dhead{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 24px;border-bottom:1px solid var(--line);font-size:18px}
.st-drop{text-align:center;padding:64px 24px}.st-drop.over{background:#e8f0fe}
.st-drop label.st-primary{color:#fff;margin-top:16px;font-size:14px}
@media (max-width:900px){.st-side{width:72px}.st-side span,.st-me b,.st-me .small{display:none}.st-me .avatar{width:40px;height:40px;font-size:18px;margin:0}.st-side>a:not(.st-me){justify-content:center;padding:0}
  .st-main{padding:16px}.st-edit{flex-direction:column}.st-prev{width:100%}.st-brand{flex-direction:column;align-items:flex-start}}
@media (max-width:1000px){.watch{flex-direction:column}.watch .secondary{width:100%}}
@media (max-width:790px){nav{display:none}main{margin-left:0;padding:16px}body.mini nav{display:block}.search button{width:44px}.logo span.t{display:none}.chead{padding:16px}}
</style>
</head>
<body>
<header>
  <button class="burger" onclick="document.body.classList.toggle('mini')">☰</button>
  <a href="#/" class="logo"><span class="play"><i></i></span><span class="t">SlopTube</span><sup style="font-size:10px;color:#606060;font-weight:400;letter-spacing:0" id="region"></sup></a>
  <form class="search" onsubmit="event.preventDefault();location.hash='#/search/'+encodeURIComponent(this.q.value)">
    <input name="q" data-tp="Search" placeholder="Search"><button aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#333" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg></button>
  </form>
  <div class="hright" id="hright"></div>
</header>
<nav id="nav">
  <a href="#/" data-r="" data-t="Home">Home</a>
  <a href="#/trending" data-r="trending" data-t="New today">New today</a>
  <a href="#/subs" data-r="subs" data-t="Subscriptions">Subscriptions</a>
  <hr>
  <a href="#/channels" data-r="channels" data-t="Channels">Channels</a>
  <a href="#/studio" data-r="studio">SlopTube Studio</a>
  <a href="#/settings" data-r="settings" data-t="Settings">Settings</a>
  <hr>
  <div class="h" data-t="Subscriptions">Subscriptions</div>
  <div id="subslist"></div>
  <hr>
  <div class="foot">© 2019 SlopTube LLC<br><span data-t="Hosted on GitHub Pages">Hosted on GitHub Pages</span><br><br><a href="#/settings"><span data-t="Language">Language</span>: <span id="langname"></span></a></div>
</nav>
<main id="app"></main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
